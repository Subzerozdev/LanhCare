# ============================================
# PRODUCTION CONFIGURATION
# Supports: Render, Aiven, Railway, Supabase, etc.
# ============================================

# Application Name
spring.application.name=LanhCare

# Server Configuration
server.port=${PORT:8080}

# ============================================
# DATABASE CONFIGURATION
# ============================================
# For Aiven/Cloud PostgreSQL, use format:
# jdbc:postgresql://HOST:PORT/DATABASE?sslmode=require
#
# Example Aiven URL:
# jdbc:postgresql://pg-xxx.aiven.io:12345/defaultdb?sslmode=require
#
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings for production
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Disable open-in-view for better performance
spring.jpa.open-in-view=false

# ============================================
# SQL INITIALIZATION
# ============================================
# Disable SQL init in production - use migrations or manual setup
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.lanhcare=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ============================================
# ACTUATOR CONFIGURATION
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true

# ============================================
# JWT CONFIGURATION
# ============================================
app.jwt.secret=${APP_JWT_SECRET:change-this-in-production-please-use-256-bit-secret}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ============================================
# GOOGLE OAUTH2 CONFIGURATION
# ============================================
# DISABLED: Uncomment and add credentials when you have Google OAuth2 setup
# To enable Google OAuth2, add these environment variables:
# - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
# - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
#
# spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
# spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
# spring.security.oauth2.client.registration.google.scope=profile,email
# spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/auth/oauth2/callback/google

# ============================================
# API CONFIGURATION
# ============================================
app.api.version=1.0.0

# ============================================
# SWAGGER/OPENAPI CONFIGURATION
# ============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Try to use the request URL for server detection
springdoc.swagger-ui.url=/v3/api-docs

# Render.com External URL (set by Render automatically)
# Format: https://your-app-name.onrender.com
render.external.url=${RENDER_EXTERNAL_URL:}

# Force HTTPS in forwarded headers (important for Render)
server.forward-headers-strategy=framework

# ============================================
# ICD API CONFIGURATION
# ============================================
icd.client.id=${ICD_CLIENT_ID:}
icd.client.secret=${ICD_CLIENT_SECRET:}
icd.auth.server.url=https://icdaccessmanagement.who.int/connect/token
icd.base.url=https://id.who.int/icd/release/11
icd.linearization.name=mms
icd.release=2025-01

# ============================================
# TRANSLATOR CONFIGURATION
# ============================================
translate.endpoint=https://translate-api.com/v1/translate
translate.api.key=${TRANSLATE_API_KEY:}

# ============================================
# CLOUDINARY CONFIGURATION (Image Upload)
# ============================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:djtdg8r8p}
cloudinary.api-key=${CLOUDINARY_API_KEY:316745718961788}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
