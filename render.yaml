# Render Blueprint Configuration
# This file defines the infrastructure for deploying LanhCare to Render

databases:
  - name: lanhcare-db
    plan: free # Use 'starter' for production
    databaseName: lanhcare_db
    user: lanhcare_user
    region: singapore # Closest to Vietnam
    postgresMajorVersion: 16

services:
  - type: web
    name: lanhcare-api
    runtime: docker
    plan: free # Use 'starter' for production
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # Database connection (auto-populated from database)
      - key: DATABASE_URL
        fromDatabase:
          name: lanhcare-db
          property: connectionString
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: lanhcare-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: lanhcare-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: lanhcare-db
          property: password
      # Application settings
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      # JWT Secret (generate a secure one)
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_MS
        value: 86400000
      # JPA settings
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: false
      # Disable SQL init in production (use migrations instead)
      - key: SPRING_SQL_INIT_MODE
        value: never
      # Google OAuth2 (set these manually in Render dashboard)
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
        sync: false
      # ICD API credentials
      - key: ICD_CLIENT_ID
        sync: false
      - key: ICD_CLIENT_SECRET
        sync: false
      # Translation API
      - key: TRANSLATE_API_KEY
        sync: false
